[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "orto"
version = "0.1.0"
description = "Neurosymbolic Grammatical Error Correction & Diagnostic Engine"
readme = "README.md"
authors = [{ name = "Orto Contributors" }]
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
dependencies = [
    "spacy>=3.7.0,<4.0.0",
    "pydantic>=2.0.0,<3.0.0",
    "openai>=1.0.0,<2.0.0",
    "streamlit>=1.30.0",
    "python-dotenv>=1.0.0",
    "rich>=13.0.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["orto*", "benchmarks*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v"
